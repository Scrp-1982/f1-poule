<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 Poule</title>
<meta name="theme-color" content="#FF6600">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF6600;
  --bg: #000000;
  --surface: #1A1A1A;
  --row: #3A3A3A;
  --ink: #FFFFFF;
  --muted: #A6A6A6;
  --line: #333333;
  --open: #FF6600;
  --open-soft: #331A07;
  --closed: #E5483F;
  --closed-soft: #3A1614;
  --ok: #57C980;
  --ok-soft: #13301E;
  --link: #FF8A3D;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --text: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.5 var(--text);
  min-height: 100vh;
  padding-bottom: 4.5rem;
}
a { color: var(--link); }
h1, h2, h3, legend { font-family: var(--display); font-weight: 600; line-height: 1.15; margin: 0; }
h2 { font-size: 1.9rem; }
h3 { font-size: 1.3rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.stack > * + * { margin-top: .75rem; }
.loading { color: var(--muted); padding: 2rem 0; text-align: center; }

/* Kopbalk */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  background: var(--orange); color: #FFFFFF;
  padding: .7rem 1rem;
  border-bottom: 4px solid transparent;
  border-image: repeating-linear-gradient(90deg, #fff 0 8px, #000 8px 16px) 4;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--orange); }
.top h1 { font-size: 1.6rem; letter-spacing: .01em; }
.top select { background: transparent; color: #FFFFFF; border: 1px solid #ffffffaa; border-radius: 6px; padding: .3rem .5rem; font: 600 1rem var(--display); }
.top select option { color: #000; }

main { max-width: 760px; margin: 0 auto; padding: 1rem; background: var(--bg); min-height: calc(100vh - 3.5rem); }
@media (min-width: 800px) { body { background: var(--orange); } }
main > * + * { margin-top: 1rem; }

/* Onderbalk */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs a {
  flex: 1; text-align: center; padding: .85rem .25rem; text-decoration: none;
  color: var(--muted); font: 600 1.05rem var(--display); border-top: 3px solid transparent;
}
.tabs a.on { color: var(--ink); border-top-color: var(--orange); }

/* Panelen en formulieren */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; }
fieldset.panel { margin: 0; min-width: 0; }
legend { font-size: 1.15rem; padding: 0 .35rem; margin-left: -.35rem; }
.field { display: grid; gap: .3rem; }
.field > span { font-weight: 600; font-size: .9rem; }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: .6rem .7rem; width: 100%; min-width: 0;
}
input[type=checkbox] { width: auto; }
input[type=color] { width: 3rem; padding: .15rem; height: 2.4rem; }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
.btn {
  font: 600 1.05rem var(--display); letter-spacing: .02em;
  background: var(--orange); color: #000; border: 0; border-radius: 8px;
  padding: .65rem 1.1rem; cursor: pointer; text-decoration: none; display: inline-block;
}
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { font-size: .95rem; padding: .35rem .7rem; }
.row { display: flex; gap: .5rem; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row.wrap > input { flex: 1 1 8rem; }

.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg > * {
  flex: 1; text-align: center; padding: .55rem .4rem; border: 0; background: none; color: var(--muted);
  font: 600 1rem var(--display); text-decoration: none; cursor: pointer;
}
.seg > .on { background: var(--orange); color: #000; }

.banner { border-left: 4px solid var(--line); background: var(--surface); padding: .7rem .9rem; border-radius: 0 8px 8px 0; }
.banner.yellow { border-color: var(--open); background: var(--open-soft); }
.banner.red { border-color: var(--closed); background: var(--closed-soft); }

/* Inloggen */
.auth { max-width: 420px; margin: 2rem auto 0; }
.auth > * + * { margin-top: 1rem; }
.brand h2 { font-size: 3rem; font-weight: 700; }
.flag {
  display: block; width: 72px; height: 36px; margin-bottom: .6rem; border-radius: 3px;
  background: repeating-conic-gradient(var(--ink) 0 25%, var(--surface) 0 50%) 0 0 / 18px 18px;
}

/* Volgende race */
.next {
  display: block; text-decoration: none; color: var(--ink); background: var(--surface);
  border: 2px solid var(--orange); border-radius: 12px; padding: 1.1rem 1.1rem 1rem; position: relative; overflow: hidden;
}
.next .rnd { font: 700 4.5rem/0.8 var(--display); color: #FF660055; position: absolute; right: .6rem; top: .6rem; }
.next h2 { font-size: 2.1rem; max-width: 80%; }
.next p { margin-top: .35rem; color: var(--muted); }
.meter { height: 6px; background: var(--row); border-radius: 3px; margin-top: .9rem; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--open); }

/* Racelijst */
.races { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.races li + li { border-top: 1px solid var(--line); }
.races a { display: grid; grid-template-columns: 2.4rem 1fr auto; gap: .2rem .6rem; align-items: center; padding: .7rem .9rem; color: var(--ink); text-decoration: none; }
.races .rnd { font: 700 1.6rem/1 var(--display); color: var(--muted); grid-row: span 2; }
.races .nm { font-weight: 600; }
.races .dt { font-size: .875rem; color: var(--muted); }
.races .cancel .nm { text-decoration: line-through; color: var(--muted); }
.pill { font: 600 .9rem var(--display); padding: .1rem .5rem; border-radius: 4px; grid-row: span 2; white-space: nowrap; }
.pill.open { background: var(--orange); color: #000; }
.pill.closed { background: var(--row); color: var(--muted); }
.pill.cancel { background: var(--closed-soft); color: var(--closed); }
.pill.done { background: var(--ok-soft); color: var(--ok); }

/* Voorspellen */
.back { font-weight: 600; text-decoration: none; }
.gp-title { font-size: 2.3rem; }
.q { display: grid; grid-template-columns: 1fr auto; gap: .35rem .75rem; align-items: baseline; padding: .7rem 0; }
.q + .q { border-top: 1px solid var(--line); }
.q select, .q input { grid-column: 1 / -1; }
.q input[type=number] { max-width: 7rem; }
.pt { font: 600 .95rem var(--display); color: var(--muted); }
.savebar {
  position: sticky; bottom: calc(3.6rem + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .6rem .6rem 1rem;
}

/* Uitslag per vraag */
.qres > * + * { margin-top: .6rem; }
.qhead { display: flex; justify-content: space-between; gap: .75rem; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .55rem; border-radius: 5px; background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.chip button { border: 0; background: none; color: inherit; font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 0 .1rem; }
.addans { display: flex; gap: .5rem; }
.picks { list-style: none; margin: 0; padding: 0; }
.picks li { display: grid; grid-template-columns: 1fr auto 2.5rem; gap: .5rem; padding: .3rem 0; border-top: 1px dashed var(--line); }
.picks .gain { text-align: right; font: 700 1rem var(--display); color: var(--ok); }
.picks .hit span:nth-child(2) { color: var(--ok); font-weight: 600; }

/* Stand */
.tower { list-style: none; margin: 0; padding: 0; }
.tower li {
  display: grid; grid-template-columns: 3rem 1fr auto auto; gap: .75rem; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--line);
  border-radius: 6px; padding: .55rem .9rem .55rem .6rem;
}
.tower li + li { margin-top: .4rem; }
.tower li.p1 { border-left-color: var(--orange); }
.tower .pos { font: 700 2rem/1 var(--display); text-align: center; }
.tower .who { font-weight: 600; }
.tower .last { font: 600 .95rem var(--display); color: var(--ok); }
.tower .pts { font: 700 1.6rem/1 var(--display); min-width: 2.5rem; text-align: right; }

/* Beheer */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; justify-content: space-between; align-items: center; gap: .75rem; padding: .55rem 0; }
.list li + li { border-top: 1px solid var(--line); }
.drow select { max-width: 11rem; }
.sw { display: inline-block; width: .8rem; height: .8rem; border-radius: 2px; margin-right: .45rem; vertical-align: -1px; }
details.gpe { border-top: 1px solid var(--line); padding: .55rem 0; }
details.gpe summary { cursor: pointer; font-weight: 600; }
details.gpe form { margin-top: .75rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.check { display: flex; gap: .5rem; align-items: center; }

/* Vragen beheren */
.qhdr, .qline { display: grid; grid-template-columns: 1fr 4.5rem 2.4rem; gap: .5rem; align-items: center; }
.qhdr { font-size: .85rem; color: var(--muted); margin-bottom: .3rem; }
.qhdr span:nth-child(2) { text-align: center; }
.qline + .qline { margin-top: .45rem; }
.qline input[type=number] { text-align: center; }
.qline.add { margin-top: .9rem; padding-top: .9rem; border-top: 1px dashed var(--line); }
.qline.add select { grid-column: 1; }
.qline.add .btn { grid-column: 2 / 4; }
.icon { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; height: 2.4rem; cursor: pointer; font-size: 1.2rem; }

/* Punten per race */
.matrix { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.matrix table { border-collapse: collapse; font-size: .95rem; }
.matrix th { font-weight: 500; color: var(--muted); vertical-align: bottom; padding: .5rem .3rem; }
.matrix th.v span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; display: inline-block; }
.matrix th.x span { text-decoration: line-through; }
.matrix td { text-align: center; padding: .35rem .45rem; }
.matrix td.nm, .matrix th.nm { text-align: left; padding-left: .8rem; white-space: nowrap; position: sticky; left: 0; background: inherit; }
.matrix tbody tr:nth-child(odd) { background: var(--row); }
.matrix tbody tr:nth-child(even) { background: var(--surface); }
.matrix thead tr { background: var(--surface); }
.matrix td.tot { font: 700 1.1rem var(--display); color: var(--orange); }

#toast {
  position: fixed; left: 50%; bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(1rem);
  background: var(--ink); color: var(--surface); padding: .65rem 1rem; border-radius: 8px; max-width: calc(100% - 2rem);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20;
}
#toast.show { opacity: 1; transform: translateX(-50%); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
</head>
<body>
<header class="top">
  <h1 id="title">F1 Poule</h1>
  <div id="seasonPick"></div>
</header>
<main id="view"><p class="loading">Laden…</p></main>
<nav class="tabs" id="tabs" hidden>
  <a href="#races" data-tab="races">Races</a>
  <a href="#stand" data-tab="stand">Stand</a>
  <a href="#profiel" data-tab="profiel">Profiel</a>
  <a href="#beheer" data-tab="beheer" id="admTab" hidden>Beheer</a>
</nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// ---------------------------------------------------------------------
// Instellingen
// ---------------------------------------------------------------------
const VERSION = "2026-10-25.4";
const SUPABASE_URL = "https://wddimxolwygkuaoiovte.supabase.co";
const SUPABASE_KEY = "sb_publishable_CNctgxeIuYHmUkPLG9nIVQ_107mmpnP";
const SITE_URL = "https://f1.mhavers.nl/";
const F1_API = "https://api.jolpi.ca/ergast/f1/";
const POSITIONS = 22;

const TEAM_COLORS = {
  red_bull: "#3671C6", ferrari: "#E8002D", mercedes: "#27F4D2", mclaren: "#FF8000",
  aston_martin: "#229971", alpine: "#0093CC", williams: "#64C4FF", rb: "#6692FF",
  haas: "#B6BABD", sauber: "#52E252",
};
const CATS = [["kwalificatie", "Kwalificatie"], ["race", "Race"], ["seizoen", "Seizoen"]];
const FIELD = { coureur: "driver_id", team: "team_id", positie: "position" };

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const state = { user: null, me: null, season: null, seasons: [], teams: [], drivers: [], lineup: [], profiles: [] };

// ---------------------------------------------------------------------
// Hulpfuncties
// ---------------------------------------------------------------------
const $ = s => document.querySelector(s);
const view = () => $("#view");
const LOADING = `<p class="loading">Laden…</p>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 3500);
}
const fmtDate = d => d ? new Date(d).toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short" }) : "datum onbekend";
const fmtDateTime = d => d ? new Date(d).toLocaleString("nl-NL", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "nog niet bekend";
function toLocalInput(d) {
  if (!d) return "";
  const x = new Date(d);
  return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}
const fromLocalInput = v => v ? new Date(v).toISOString() : null;
function untilText(d) {
  const ms = new Date(d) - Date.now();
  if (ms <= 0) return "gesloten";
  const h = Math.floor(ms / 36e5);
  if (h < 1) return `nog ${Math.max(1, Math.round(ms / 6e4))} minuten`;
  if (h < 48) return `nog ${h} uur`;
  return `nog ${Math.floor(h / 24)} dagen`;
}
const validColor = c => /^#[0-9a-f]{6}$/i.test(c || "") ? c : "#999999";
const driverById = id => state.drivers.find(d => d.id === id);
const teamById = id => state.teams.find(t => t.id === id);
const shortName = d => `${d.first_name ? d.first_name[0] + ". " : ""}${d.last_name}`;
const driverName = id => { const d = driverById(id); return d ? shortName(d) : "Onbekende coureur"; };
const teamName = id => teamById(id)?.name || "Onbekend team";
const answerValue = (q, a) => a ? a[FIELD[q.answer_type]] : null;
function answerRow(q, value) {
  const r = { driver_id: null, team_id: null, position: null };
  r[FIELD[q.answer_type]] = Number(value);
  return r;
}
function answerLabel(q, a) {
  if (!a) return "–";
  if (q.answer_type === "coureur") return driverName(a.driver_id);
  if (q.answer_type === "team") return teamName(a.team_id);
  return a.position ? `P${a.position}` : "–";
}
const sameAnswer = (a, b) =>
  (a.driver_id ?? null) === (b.driver_id ?? null) &&
  (a.team_id ?? null) === (b.team_id ?? null) &&
  (a.position ?? null) === (b.position ?? null);
const isOpen = (deadline, cancelled) => !cancelled && (!deadline || new Date(deadline) > new Date());

function answerInput(q, selected, attrs) {
  if (q.answer_type === "positie") {
    return `<input type="number" min="1" max="${POSITIONS}" inputmode="numeric" placeholder="Positie" value="${selected ?? ""}" ${attrs}>`;
  }
  return `<select ${attrs}>${optionsFor(q, selected)}</select>`;
}

function optionsFor(q, selected) {
  if (q.answer_type === "positie") {
    return `<option value="">Kies een positie</option>` +
      Array.from({ length: POSITIONS }, (_, i) => `<option value="${i + 1}" ${selected === i + 1 ? "selected" : ""}>P${i + 1}</option>`).join("");
  }
  if (q.answer_type === "team") {
    return `<option value="">Kies een team</option>` + state.teams
      .filter(t => t.active || t.id === selected)
      .map(t => `<option value="${t.id}" ${t.id === selected ? "selected" : ""}>${esc(t.name)}</option>`).join("");
  }
  const opt = d => `<option value="${d.id}" ${d.id === selected ? "selected" : ""}>${esc(shortName(d))}</option>`;
  const inLineup = new Set(state.lineup.map(l => l.driver_id));
  const groups = state.teams.map(t => ({
    t, ds: state.lineup.filter(l => l.team_id === t.id).map(l => driverById(l.driver_id)).filter(Boolean),
  })).filter(g => g.ds.length);
  const others = state.drivers.filter(d => !inLineup.has(d.id) && (d.active || d.id === selected));
  return `<option value="">Kies een coureur</option>` +
    groups.map(g => `<optgroup label="${esc(g.t.name)}">${g.ds.map(opt).join("")}</optgroup>`).join("") +
    (others.length ? `<optgroup label="${groups.length ? "Overige coureurs" : "Coureurs"}">${others.map(opt).join("")}</optgroup>` : "");
}

// ---------------------------------------------------------------------
// Inloggen
// ---------------------------------------------------------------------
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") { state.user = null; renderAuth(); } });
  if (session) await afterLogin(session.user);
  else renderAuth();
}

function authError(err) {
  const m = err?.message || "";
  if (/database error/i.test(m)) return "Dit e-mailadres is niet uitgenodigd. Vraag de beheerder om een uitnodiging.";
  if (/invalid login/i.test(m)) return "E-mailadres of wachtwoord klopt niet.";
  if (/already registered/i.test(m)) return "Er bestaat al een account met dit e-mailadres. Log in.";
  if (/password/i.test(m)) return "Kies een wachtwoord van minstens 8 tekens.";
  return "Dat lukte niet: " + m;
}

function renderAuth(mode = "login") {
  $("#tabs").hidden = true;
  $("#seasonPick").innerHTML = "";
  $("#title").textContent = "F1 Poule";
  window.onhashchange = null;
  view().innerHTML = `
    <section class="auth">
      <div class="brand">
        <span class="flag" aria-hidden="true"></span>
        <h2>F1 Poule</h2>
        <p class="muted">Voorspel elk raceweekend wie er wint, wie uitvalt en wie de snelste ronde rijdt.</p>
      </div>
      <div class="seg">
        <button type="button" data-mode="login" class="${mode === "login" ? "on" : ""}">Inloggen</button>
        <button type="button" data-mode="signup" class="${mode === "signup" ? "on" : ""}">Account maken</button>
      </div>
      <form id="authForm" class="panel stack">
        ${mode === "signup" ? `<label class="field"><span>Naam</span><input name="name" required maxlength="40" autocomplete="nickname"></label>` : ""}
        <label class="field"><span>E-mailadres</span><input name="email" type="email" required autocomplete="email"></label>
        <label class="field"><span>Wachtwoord</span><input name="password" type="password" required minlength="8" autocomplete="${mode === "login" ? "current-password" : "new-password"}"></label>
        ${mode === "signup" ? `<p class="muted small">Gebruik het e-mailadres waarop je bent uitgenodigd.</p>` : ""}
        <button class="btn" type="submit">${mode === "login" ? "Inloggen" : "Account maken"}</button>
      </form>
    </section>`;
  view().querySelectorAll("[data-mode]").forEach(b => b.onclick = () => renderAuth(b.dataset.mode));
  $("#authForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const btn = e.target.querySelector("button[type=submit]");
    const email = String(f.get("email")).trim().toLowerCase();
    const password = String(f.get("password"));
    btn.disabled = true;
    const res = mode === "login"
      ? await sb.auth.signInWithPassword({ email, password })
      : await sb.auth.signUp({ email, password, options: { data: { display_name: String(f.get("name")).trim() } } });
    btn.disabled = false;
    if (res.error) return toast(authError(res.error));
    if (!res.data.session) { toast("Account gemaakt. Log nu in."); return renderAuth("login"); }
    afterLogin(res.data.session.user);
  };
}

async function afterLogin(user) {
  state.user = user;
  view().innerHTML = LOADING;
  const { data: me } = await sb.from("profiles").select("*").eq("id", user.id).single();
  state.me = me;
  await loadBase();
  $("#tabs").hidden = false;
  $("#admTab").hidden = !state.me?.is_admin;
  window.onhashchange = route;
  route();
}

async function loadBase() {
  const [s, t, d, p] = await Promise.all([
    sb.from("seasons").select("*").order("year", { ascending: false }),
    sb.from("teams").select("*").order("name"),
    sb.from("drivers").select("*").order("last_name"),
    sb.from("profiles").select("id, display_name, is_admin").order("display_name"),
  ]);
  state.seasons = s.data || [];
  state.teams = t.data || [];
  state.drivers = d.data || [];
  state.profiles = p.data || [];
  if (!state.seasons.some(x => x.year === state.season)) {
    const y = new Date().getFullYear();
    state.season = (state.seasons.find(x => x.year === y) || state.seasons[0])?.year ?? null;
  }
  await loadLineup();
  renderSeasonPicker();
}

async function loadLineup() {
  if (!state.season) { state.lineup = []; return; }
  const { data } = await sb.from("season_drivers").select("*").eq("season", state.season);
  state.lineup = data || [];
}

async function setSeason(year) {
  if (year === state.season) return;
  state.season = year;
  await loadLineup();
  renderSeasonPicker();
}

function renderSeasonPicker() {
  const el = $("#seasonPick");
  if (!state.user || !state.seasons.length) { el.innerHTML = ""; return; }
  el.innerHTML = `<select aria-label="Seizoen">${state.seasons.map(s =>
    `<option value="${s.year}" ${s.year === state.season ? "selected" : ""}>${s.year}</option>`).join("")}</select>`;
  el.querySelector("select").onchange = async e => {
    await setSeason(Number(e.target.value));
    if (location.hash.startsWith("#gp/") || location.hash.startsWith("#seizoen/")) location.hash = "#races";
    else route();
  };
}

// ---------------------------------------------------------------------
// Navigatie
// ---------------------------------------------------------------------
function route() {
  const [page, arg] = (location.hash.slice(1) || "races").split("/");
  const tab = { gp: "races", seizoen: "races" }[page] || page;
  document.querySelectorAll(".tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
  window.scrollTo(0, 0);
  if (page === "gp") return renderGp(Number(arg));
  if (page === "seizoen") return renderSeasonQs(Number(arg));
  if (page === "stand") return renderStand();
  if (page === "profiel") return renderProfile();
  if (page === "beheer" && state.me?.is_admin) return renderAdmin(arg || "deelnemers");
  return renderRaces();
}
const setTitle = t => $("#title").textContent = t;

// Races
// ---------------------------------------------------------------------
async function renderRaces() {
  setTitle("Races");
  if (!state.season) {
    view().innerHTML = `<div class="panel stack"><p>Er staat nog geen seizoen klaar.</p>
      ${state.me?.is_admin ? `<a class="btn" href="#beheer/kalender">Seizoen toevoegen</a>` : `<p class="muted">De beheerder zet de kalender klaar.</p>`}</div>`;
    return;
  }
  view().innerHTML = LOADING;
  const year = state.season;
  const { data: gps } = await sb.from("grand_prix").select("*").eq("season", year)
    .order("race_start", { ascending: true, nullsFirst: false }).order("round");
  const ids = (gps || []).map(g => g.id);
  const [gq, sq, mine] = await Promise.all([
    ids.length ? sb.from("gp_questions").select("id, grand_prix_id").in("grand_prix_id", ids) : { data: [] },
    sb.from("gp_questions").select("id").eq("season", year),
    sb.from("predictions").select("gp_question_id").eq("user_id", state.user.id),
  ]);
  const done = new Set((mine.data || []).map(p => p.gp_question_id));
  const per = {};
  for (const q of gq.data || []) {
    const r = per[q.grand_prix_id] ||= { total: 0, filled: 0 };
    r.total++;
    if (done.has(q.id)) r.filled++;
  }
  const seasonQs = sq.data || [];
  const seasonRow = state.seasons.find(s => s.year === year);
  const seasonFilled = seasonQs.filter(q => done.has(q.id)).length;

  const next = (gps || []).find(g => g.status !== "geannuleerd" && per[g.id]?.total && isOpen(g.quali_start, false));
  let html = "";
  if (next) {
    const r = per[next.id];
    html += `
      <a class="next" href="#gp/${next.id}">
        <span class="rnd" aria-hidden="true">${next.round ?? ""}</span>
        <h2>${esc(next.name)}</h2>
        <p>Invullen kan tot ${fmtDateTime(next.quali_start)}${next.quali_start ? `, ${untilText(next.quali_start)}` : ""}.</p>
        <div class="meter"><i style="width:${Math.round(r.filled / r.total * 100)}%"></i></div>
        <p>${r.filled === r.total ? "Alles ingevuld. Je kunt nog wijzigen tot de sluitingstijd." : `${r.filled} van ${r.total} vragen ingevuld`}</p>
      </a>`;
  }
  if (seasonQs.length) {
    const open = isOpen(seasonRow?.deadline, false);
    html += `
      <ul class="races"><li><a href="#seizoen/${year}">
        <span class="rnd">${String(year).slice(2)}</span>
        <span class="nm">Seizoensvragen</span>
        ${pill(open, false, seasonFilled, seasonQs.length)}
        <span class="dt">${open ? `Invullen kan tot ${fmtDateTime(seasonRow?.deadline)}` : "Gesloten"}</span>
      </a></li></ul>`;
  }
  if (!(gps || []).length) {
    html += `<div class="panel stack"><p>De kalender voor ${year} is nog leeg.</p>
      ${state.me?.is_admin ? `<a class="btn" href="#beheer/kalender">Kalender ophalen</a>` : ""}</div>`;
  } else {
    html += `<ul class="races">${gps.map(g => {
      const r = per[g.id];
      const cancelled = g.status === "geannuleerd";
      return `<li class="${cancelled ? "cancel" : ""}"><a href="#gp/${g.id}">
        <span class="rnd">${g.round ?? "–"}</span>
        <span class="nm">${esc(g.name)}</span>
        ${r || cancelled ? pill(isOpen(g.quali_start, cancelled), cancelled, r?.filled, r?.total) : `<span class="pill closed">Nog niet open</span>`}
        <span class="dt">${fmtDate(g.race_start)}${g.status === "verplaatst" ? ", verplaatst" : ""}</span>
      </a></li>`;
    }).join("")}</ul>`;
  }
  view().innerHTML = html;
}

function pill(open, cancelled, filled = 0, total = 0) {
  if (cancelled) return `<span class="pill cancel">Geannuleerd</span>`;
  if (!open) return `<span class="pill closed">Gesloten</span>`;
  if (total && filled === total) return `<span class="pill done">Ingevuld</span>`;
  return `<span class="pill open">${filled}/${total}</span>`;
}

async function renderGp(id) {
  view().innerHTML = LOADING;
  const { data: gp } = await sb.from("grand_prix").select("*").eq("id", id).maybeSingle();
  if (!gp) { view().innerHTML = `<p class="panel">Deze grand prix bestaat niet (meer). <a href="#races">Naar alle races</a></p>`; return; }
  if (gp.season !== state.season) await setSeason(gp.season);
  const { data: qs } = await sb.from("gp_questions").select("*").eq("grand_prix_id", id).order("sort_order");
  renderQuestionPage({
    kind: "gp", gp, qs: qs || [], deadline: gp.quali_start, cancelled: gp.status === "geannuleerd", title: gp.name,
  });
}

async function renderSeasonQs(year) {
  view().innerHTML = LOADING;
  await setSeason(year);
  const s = state.seasons.find(x => x.year === year);
  const { data: qs } = await sb.from("gp_questions").select("*").eq("season", year).order("sort_order");
  renderQuestionPage({ kind: "seizoen", year, qs: qs || [], deadline: s?.deadline, cancelled: false, title: `Seizoensvragen ${year}` });
}

async function renderQuestionPage(ctx) {
  const { kind, gp, qs, deadline, cancelled, title } = ctx;
  setTitle(kind === "gp" ? "Grand prix" : "Seizoen");
  const admin = state.me?.is_admin;
  const ids = qs.map(q => q.id);
  let preds = [], answers = [];
  if (ids.length) {
    const [p, a] = await Promise.all([
      sb.from("predictions").select("*").in("gp_question_id", ids),
      sb.from("correct_answers").select("*").in("gp_question_id", ids).order("created_at"),
    ]);
    preds = p.data || [];
    answers = a.data || [];
  }
  const open = isOpen(deadline, cancelled);
  const mine = Object.fromEntries(preds.filter(p => p.user_id === state.user.id).map(p => [p.gp_question_id, p]));

  let html = `<a class="back" href="#races">Alle races</a>
    <div><h2 class="gp-title">${esc(title)}</h2>
    ${kind === "gp" ? `<p class="muted">${esc([gp.circuit, gp.country].filter(Boolean).join(", "))}</p>
      <p class="muted">Race: ${fmtDateTime(gp.race_start)}</p>` : ""}</div>`;

  if (cancelled) html += `<p class="banner red">Deze grand prix is geannuleerd en telt niet mee voor de stand.</p>`;
  else if (gp?.status === "verplaatst") html += `<p class="banner">Deze race is verplaatst. Je voorspellingen blijven gewoon staan.</p>`;
  if (!cancelled && open) {
    html += deadline
      ? `<p class="banner yellow">Invullen kan tot ${fmtDateTime(deadline)} (${untilText(deadline)}). Daarna zie je ook de voorspellingen van de anderen.</p>`
      : `<p class="banner yellow">De sluitingstijd is nog niet bekend. Daarna zie je ook de voorspellingen van de anderen.</p>`;
  } else if (!cancelled) {
    html += `<p class="banner">Gesloten sinds ${fmtDateTime(deadline)}.</p>`;
  }

  if (!qs.length) {
    html += `<div class="panel stack"><p>De vragen zijn nog niet opengezet.</p>
      ${admin ? `<button class="btn" id="openQs" type="button">Vragen openzetten</button>` : `<p class="muted">De beheerder zet ze klaar.</p>`}</div>`;
    view().innerHTML = html;
    const b = $("#openQs");
    if (b) b.onclick = async () => {
      b.disabled = true;
      const { error } = kind === "gp"
        ? await sb.rpc("open_grand_prix", { gp_id: gp.id })
        : await sb.rpc("open_season", { season_year: ctx.year });
      if (error) { b.disabled = false; return toast("Openzetten lukte niet: " + error.message); }
      toast("Vragen opengezet");
      route();
    };
    return;
  }

  const groups = CATS.map(([k, l]) => ({ l, items: qs.filter(q => q.category === k) })).filter(g => g.items.length);

  if (open) {
    html += `<form id="predForm" class="stack">
      ${groups.map(g => `<fieldset class="panel"><legend>${g.l}</legend>
        ${g.items.map(q => `<label class="q">
          <span>${esc(q.text)}</span><span class="pt">${q.points} pt</span>
          ${answerInput(q, answerValue(q, mine[q.id]), `name="q${q.id}" aria-label="Antwoord"`)}
        </label>`).join("")}
      </fieldset>`).join("")}
      <div class="savebar"><span class="small" id="filled"></span><button class="btn" type="submit">Voorspelling opslaan</button></div>
    </form>`;
    view().innerHTML = html;
    const form = $("#predForm");
    const count = () => {
      const n = qs.filter(q => form.elements["q" + q.id].value).length;
      $("#filled").textContent = `${n} van ${qs.length} ingevuld`;
    };
    count();
    form.onchange = count;
    form.onsubmit = async e => {
      e.preventDefault();
      const btn = form.querySelector("button[type=submit]");
      const rows = [], clear = [];
      for (const q of qs) {
        const v = form.elements["q" + q.id].value;
        if (v) rows.push({ gp_question_id: q.id, user_id: state.user.id, ...answerRow(q, v) });
        else if (mine[q.id]) clear.push(q.id);
      }
      btn.disabled = true;
      let error = null;
      if (rows.length) ({ error } = await sb.from("predictions").upsert(rows, { onConflict: "gp_question_id,user_id" }));
      if (!error && clear.length) ({ error } = await sb.from("predictions").delete().eq("user_id", state.user.id).in("gp_question_id", clear));
      btn.disabled = false;
      if (error) return toast(/row-level security/i.test(error.message)
        ? "Opslaan lukte niet: de sluitingstijd is voorbij."
        : "Opslaan lukte niet: " + error.message);
      toast("Voorspelling opgeslagen");
      for (const r of rows) mine[r.gp_question_id] = r;
      for (const id of clear) delete mine[id];
    };
    return;
  }

  // Gesloten: juiste antwoorden en ieders voorspelling
  const correctFor = id => answers.filter(a => a.gp_question_id === id);
  const isRight = (q, p) => correctFor(q.id).some(a => sameAnswer(a, p));
  const totals = {};
  for (const p of preds) {
    const q = qs.find(x => x.id === p.gp_question_id);
    if (q && isRight(q, p)) totals[p.user_id] = (totals[p.user_id] || 0) + q.points;
  }
  if (answers.length && !cancelled) {
    const ranked = state.profiles.map(p => ({ p, pts: totals[p.id] || 0 })).sort((a, b) => b.pts - a.pts || a.p.display_name.localeCompare(b.p.display_name));
    html += `<div><h3>Punten ${kind === "gp" ? "deze race" : "seizoensvragen"}</h3></div>
      <ol class="tower">${ranked.map((r, i) => `<li class="${i === 0 && r.pts ? "p1" : ""}">
        <span class="pos">${ranked.findIndex(x => x.pts === r.pts) + 1}</span>
        <span class="who">${esc(r.p.display_name)}</span><span></span>
        <span class="pts">${r.pts}</span></li>`).join("")}</ol>`;
  }
  html += groups.map(g => `<h3>${g.l}</h3>` + g.items.map(q => {
    const correct = correctFor(q.id);
    return `<div class="panel qres">
      <div class="qhead"><span>${esc(q.text)}</span><span class="pt">${q.points} pt</span></div>
      <div class="chips">${correct.length
        ? correct.map(a => `<span class="chip">${esc(answerLabel(q, a))}${a.source === "automatisch" ? ` <span class="small">(automatisch)</span>` : ""}${admin ? `<button type="button" data-del-ans="${a.id}" aria-label="Antwoord verwijderen">×</button>` : ""}</span>`).join("")
        : `<span class="muted">Nog geen uitslag</span>`}</div>
      ${admin ? `<div class="addans">${answerInput(q, null, `data-ans-sel="${q.id}" aria-label="Juist antwoord"`)}
        <button type="button" class="btn ghost small" data-add-ans="${q.id}">Toevoegen</button></div>` : ""}
      <ul class="picks">${state.profiles.map(pr => {
        const p = preds.find(x => x.gp_question_id === q.id && x.user_id === pr.id);
        if (!p) return `<li class="muted"><span>${esc(pr.display_name)}</span><span>niet ingevuld</span><span></span></li>`;
        const ok = isRight(q, p);
        return `<li class="${ok ? "hit" : ""}"><span>${esc(pr.display_name)}</span><span>${esc(answerLabel(q, p))}</span><span class="gain">${ok ? "+" + q.points : ""}</span></li>`;
      }).join("")}</ul>
    </div>`;
  }).join("")).join("");
  view().innerHTML = html;

  if (admin) view().onclick = async e => {
    const del = e.target.closest("[data-del-ans]");
    const add = e.target.closest("[data-add-ans]");
    if (del) {
      const { error } = await sb.from("correct_answers").delete().eq("id", Number(del.dataset.delAns));
      if (error) return toast("Verwijderen lukte niet: " + error.message);
      toast("Antwoord verwijderd");
      route();
    } else if (add) {
      const q = qs.find(x => x.id === Number(add.dataset.addAns));
      const v = view().querySelector(`[data-ans-sel="${q.id}"]`).value;
      if (!v) return toast("Kies eerst een antwoord.");
      if (q.answer_type === "positie" && !(Number(v) >= 1 && Number(v) <= POSITIONS)) return toast(`Vul een positie van 1 tot en met ${POSITIONS} in.`);
      const { error } = await sb.from("correct_answers").insert({ gp_question_id: q.id, source: "handmatig", ...answerRow(q, v) });
      if (error) return toast("Opslaan lukte niet: " + error.message);
      toast("Antwoord opgeslagen");
      route();
    }
  };
}

async function renderStand() {
  setTitle("Stand");
  if (!state.season) { view().innerHTML = `<p class="panel">Er staat nog geen seizoen klaar.</p>`; return; }
  view().innerHTML = LOADING;
  const [{ data: sc, error }, { data: gps }] = await Promise.all([
    sb.from("scores").select("user_id, points, grand_prix_id").eq("season", state.season),
    sb.from("grand_prix").select("id, name, country, race_start, status").eq("season", state.season),
  ]);
  if (error) { view().innerHTML = `<p class="panel">De stand kon niet worden geladen: ${esc(error.message)}</p>`; return; }
  const total = {}, perGp = {}, seasonPts = {};
  let hasSeason = false;
  for (const s of sc || []) {
    total[s.user_id] = (total[s.user_id] || 0) + s.points;
    if (s.grand_prix_id) {
      const g = perGp[s.grand_prix_id] ||= {};
      g[s.user_id] = (g[s.user_id] || 0) + s.points;
    } else {
      hasSeason = true;
      seasonPts[s.user_id] = (seasonPts[s.user_id] || 0) + s.points;
    }
  }
  const cols = [...(gps || [])].sort((a, b) => new Date(a.race_start || 0) - new Date(b.race_start || 0));
  const last = (gps || []).filter(g => perGp[g.id]).sort((a, b) => new Date(b.race_start) - new Date(a.race_start))[0];
  const rows = state.profiles.map(p => ({ p, pts: total[p.id] || 0, last: last ? (perGp[last.id][p.id] || 0) : null }))
    .sort((a, b) => b.pts - a.pts || a.p.display_name.localeCompare(b.p.display_name));
  view().innerHTML = `
    <div><h2>Stand ${state.season}</h2>
      <p class="muted">${last ? `Laatst bijgewerkt na ${esc(last.name)}. Het groene getal is wat iedereen daar scoorde.` : "Nog geen punten. De stand verschijnt na de eerste uitslag."}</p></div>
    <ol class="tower">${rows.map((r, i) => `<li class="${i === 0 && r.pts ? "p1" : ""}">
      <span class="pos">${rows.findIndex(x => x.pts === r.pts) + 1}</span>
      <span class="who">${esc(r.p.display_name)}</span>
      <span class="last">${r.last ? "+" + r.last : ""}</span>
      <span class="pts">${r.pts}</span>
    </li>`).join("")}</ol>
    ${cols.length ? `<h3>Punten per race</h3>
    <div class="matrix"><table>
      <thead><tr><th class="nm"></th><th class="v"><span>Totaal</span></th>
        ${cols.map(g => `<th class="v${g.status === "geannuleerd" ? " x" : ""}" title="${esc(g.name)}"><span>${esc(g.country || g.name)}</span></th>`).join("")}
        <th class="v"><span>Seizoensvragen</span></th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="nm">${esc(r.p.display_name)}</td><td class="tot">${r.pts}</td>
        ${cols.map(g => `<td>${perGp[g.id] ? (perGp[g.id][r.p.id] || 0) : ""}</td>`).join("")}
        <td>${hasSeason ? (seasonPts[r.p.id] || 0) : ""}</td></tr>`).join("")}</tbody>
    </table></div>` : ""}`;
}

function renderProfile() {

  view().innerHTML = `
    <form class="panel stack" id="nameForm">
      <h3>Je naam</h3>
      <label class="field"><span>Naam in de poule</span><input name="name" required maxlength="40" value="${esc(state.me?.display_name)}"></label>
      <button class="btn">Naam opslaan</button>
    </form>
    <form class="panel stack" id="pwForm">
      <h3>Wachtwoord wijzigen</h3>
      <label class="field"><span>Nieuw wachtwoord</span><input name="pw" type="password" minlength="8" required autocomplete="new-password"></label>
      <label class="field"><span>Nog een keer</span><input name="pw2" type="password" minlength="8" required autocomplete="new-password"></label>
      <button class="btn">Wachtwoord wijzigen</button>
    </form>
    <div class="panel stack">
      <p class="muted small">Ingelogd als ${esc(state.user.email)}</p>
      <button class="btn ghost" id="logout" type="button">Uitloggen</button>
    </div>
    <p class="muted small" style="text-align:center">Versie ${VERSION}</p>`;
  $("#nameForm").onsubmit = async e => {
    e.preventDefault();
    const name = String(new FormData(e.target).get("name")).trim();
    const { error } = await sb.from("profiles").update({ display_name: name }).eq("id", state.user.id);
    if (error) return toast("Opslaan lukte niet: " + error.message);
    state.me.display_name = name;
    const p = state.profiles.find(x => x.id === state.user.id);
    if (p) p.display_name = name;
    toast("Naam opgeslagen");
  };
  $("#pwForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    if (f.get("pw") !== f.get("pw2")) return toast("De twee wachtwoorden zijn niet gelijk.");
    const { error } = await sb.auth.updateUser({ password: String(f.get("pw")) });
    if (error) return toast("Wijzigen lukte niet: " + error.message);
    e.target.reset();
    toast("Wachtwoord gewijzigd");
  };
  $("#logout").onclick = () => sb.auth.signOut();
}

async function renderAdmin(sub) {
  setTitle("Beheer");

// Deelnemers en uitnodigingen
async function admPeople(box) {
  const { data: inv } = await sb.from("invites").select("*").order("created_at", { ascending: false });
  const open = (inv || []).filter(i => !i.accepted_at);
  box.innerHTML = `
    <form class="panel stack" id="invForm">
      <h3>Iemand uitnodigen</h3>
      <p class="muted small">Na het uitnodigen opent je mailprogramma met een kant-en-klaar bericht. De ander maakt daarna een account met precies dit e-mailadres.</p>
      <label class="field"><span>E-mailadres</span><input name="email" type="email" required autocomplete="off"></label>
      <button class="btn">Uitnodigen</button>

async function getJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`de gegevensbron gaf foutcode ${r.status}`);
  return r.json();
}
const NL_COUNTRY = {
  Australia: "Australië", China: "China", Japan: "Japan", Bahrain: "Bahrein", "Saudi Arabia": "Saoedi-Arabië",
  USA: "Verenigde Staten", "United States": "Verenigde Staten", Canada: "Canada", Monaco: "Monaco", Spain: "Spanje",
  Austria: "Oostenrijk", UK: "Groot-Brittannië", "United Kingdom": "Groot-Brittannië", Belgium: "België",
  Hungary: "Hongarije", Netherlands: "Nederland", Italy: "Italië", Azerbaijan: "Azerbeidzjan", Singapore: "Singapore",
  Mexico: "Mexico", Brazil: "Brazilië", Qatar: "Qatar", UAE: "Abu Dhabi", "United Arab Emirates": "Abu Dhabi",
};
function dutchLabel(r) {
  const loc = r.Circuit?.Location || {};
  if (loc.locality === "Miami") return "Miami";
  if (loc.locality === "Las Vegas") return "Las Vegas";
  if (r.Circuit?.circuitId === "catalunya") return "Spanje (Catalunya)";
  if (r.Circuit?.circuitId === "imola") return "Emilia-Romagna";
  return NL_COUNTRY[loc.country] || loc.country || r.raceName;
}
const isoOf = (date, time) => date ? new Date(`${date}T${time || "12:00:00Z"}`).toISOString() : null;

async function importSeason(year) {
  const base = F1_API + year;
  const [rj, dj, cj] = await Promise.all([
    getJson(base + ".json?limit=100"),
    getJson(base + "/drivers.json?limit=100"),
    getJson(base + "/constructors.json?limit=100"),
  ]);
  const races = rj.MRData?.RaceTable?.Races || [];
  const drivers = dj.MRData?.DriverTable?.Drivers || [];
  const cons = cj.MRData?.ConstructorTable?.Constructors || [];
  let lastRes = [];
  try {
    const lj = await getJson(base + "/last/results.json");
    lastRes = lj.MRData?.RaceTable?.Races?.[0]?.Results || [];
  } catch { /* nog geen uitslagen */ }
  if (!races.length && !drivers.length) return `Voor ${year} zijn nog geen gegevens beschikbaar.`;

  const must = r => { if (r.error) throw new Error(r.error.message); return r; };

  // Teams
  for (const c of cons) {
    const ex = state.teams.find(t => t.ext_id === c.constructorId) || state.teams.find(t => t.name.toLowerCase() === c.name.toLowerCase());
    if (ex) { if (ex.ext_id !== c.constructorId) must(await sb.from("teams").update({ ext_id: c.constructorId }).eq("id", ex.id)); }
    else must(await sb.from("teams").insert({ name: c.name, ext_id: c.constructorId, color: TEAM_COLORS[c.constructorId] || null }));
  }
  // Coureurs
  for (const d of drivers) {
    const ex = state.drivers.find(x => x.ext_id === d.driverId) ||
      state.drivers.find(x => `${x.first_name} ${x.last_name}`.toLowerCase() === `${d.givenName} ${d.familyName}`.toLowerCase());
    if (ex) { if (ex.ext_id !== d.driverId) must(await sb.from("drivers").update({ ext_id: d.driverId }).eq("id", ex.id)); }
    else must(await sb.from("drivers").insert({ first_name: d.givenName, last_name: d.familyName, code: d.code || null, ext_id: d.driverId }));
  }
  await loadBase();

  // Wie rijdt voor welk team (uit de laatste uitslag, als die er is)
  const lineup = lastRes.map(r => ({
    season: year,
    driver_id: state.drivers.find(d => d.ext_id === r.Driver?.driverId)?.id,
    team_id: state.teams.find(t => t.ext_id === r.Constructor?.constructorId)?.id,
    number: r.number ? Number(r.number) : null,
  })).filter(r => r.driver_id && r.team_id);
  if (lineup.length) must(await sb.from("season_drivers").upsert(lineup, { onConflict: "season,driver_id" }));

  // Races
  const { data: existing } = await sb.from("grand_prix").select("*").eq("season", year);
  let added = 0, updated = 0;
  for (const r of races) {
    const row = {
      season: year,
      round: Number(r.round),
      name: "GP " + dutchLabel(r),
      country: dutchLabel(r),
      circuit: r.Circuit?.circuitName || null,
      ext_circuit: r.Circuit?.circuitId || null,
      quali_start: r.Qualifying ? isoOf(r.Qualifying.date, r.Qualifying.time) : null,
      race_start: isoOf(r.date, r.time),
    };
    const ex = (existing || []).find(g => g.ext_circuit && g.ext_circuit === row.ext_circuit);
    if (ex) {
      const upd = { round: row.round, quali_start: row.quali_start, race_start: row.race_start };
      const moved = ex.race_start && row.race_start && new Date(ex.race_start).getTime() !== new Date(row.race_start).getTime();
      if (moved && ex.status === "gepland") upd.status = "verplaatst";
      must(await sb.from("grand_prix").update(upd).eq("id", ex.id));
      updated++;
    } else {
      must(await sb.from("grand_prix").insert(row));
      added++;
    }
  }
  const s = state.seasons.find(x => x.year === year);
  const firstQ = races.map(r => r.Qualifying ? isoOf(r.Qualifying.date, r.Qualifying.time) : null).filter(Boolean).sort()[0];
  if (s && !s.deadline && firstQ) must(await sb.from("seasons").update({ deadline: firstQ }).eq("year", year));
  await loadBase();
  return `Klaar: ${added} races toegevoegd, ${updated} bijgewerkt, ${drivers.length} coureurs en ${cons.length} teams.`;
}

// Vragen: eenvoudige lijst per onderdeel, met de punten erachter
async function admQuestions(box) {
  const { data } = await sb.from("questions").select("*").eq("active", true).order("sort_order");
  const qs = data || [];
  const maxOrder = Math.max(0, ...qs.map(q => q.sort_order));
  const groups = [["seizoen", "Seizoensvragen"], ["kwalificatie", "Kwalificatie"], ["race", "Race"]];
  box.innerHTML = `<form id="qList" class="stack">
    ${groups.map(([cat, label]) => {
      const items = qs.filter(q => q.category === cat);
      return `<fieldset class="panel">
        <legend>${label}</legend>
        <div class="qhdr"><span>Vraag</span><span>Punten</span><span></span></div>
        ${items.map(q => `<div class="qline">
          <input name="t${q.id}" value="${esc(q.text)}" required aria-label="Vraag">
          <input name="p${q.id}" type="number" min="0" max="100" value="${q.points}" required aria-label="Punten">
          <button type="button" class="icon" data-remove-q="${q.id}" aria-label="Vraag verwijderen">×</button>
        </div>`).join("") || `<p class="muted small">Nog geen vragen.</p>`}
        <div class="qline add">
          <input placeholder="Nieuwe vraag" data-new-text="${cat}" aria-label="Nieuwe vraag">
          <input type="number" min="0" max="100" value="1" data-new-pts="${cat}" aria-label="Punten">
          <span></span>
          <select data-new-type="${cat}" aria-label="Antwoord is een">
            <option value="coureur">Antwoord is een coureur</option>
            <option value="team">Antwoord is een team</option>
            <option value="positie">Antwoord is een positie</option>
          </select>
          <button type="button" class="btn ghost small" data-add-q="${cat}">Toevoegen</button>
        </div>
      </fieldset>`;
    }).join("")}
    <p class="muted small">Wijzigingen gelden voor races die je hierna openzet. Races die al open staan, houden hun vragen en punten.</p>
    <button class="btn">Wijzigingen opslaan</button>
  </form>`;

  const form = $("#qList");
  const saveChanges = async () => {
    const changed = qs.map(q => ({
      q, text: form.elements["t" + q.id].value.trim(), points: Number(form.elements["p" + q.id].value),
    })).filter(x => x.text && (x.text !== x.q.text || x.points !== x.q.points));
    for (const x of changed) {
      const { error } = await sb.from("questions").update({ text: x.text, points: x.points }).eq("id", x.q.id);
      if (error) { toast("Opslaan lukte niet: " + error.message); return false; }
    }
    return changed.length;
  };

  form.onsubmit = async e => {
    e.preventDefault();
    const n = await saveChanges();
    if (n === false) return;
    toast(n ? "Wijzigingen opgeslagen" : "Er was niets gewijzigd");
    admQuestions(box);
  };
  form.onclick = async e => {
    const rm = e.target.closest("[data-remove-q]");
    const add = e.target.closest("[data-add-q]");
    if (rm) {
      const q = qs.find(x => x.id === Number(rm.dataset.removeQ));
      if (!confirm(`"${q.text}" verwijderen? Races die al open staan, houden deze vraag.`)) return;
      if (await saveChanges() === false) return;
      const { error } = await sb.from("questions").update({ active: false }).eq("id", q.id);
      if (error) return toast("Verwijderen lukte niet: " + error.message);
      toast("Vraag verwijderd");
      admQuestions(box);
    } else if (add) {
      const cat = add.dataset.addQ;
      const text = form.querySelector(`[data-new-text="${cat}"]`).value.trim();
      if (!text) return toast("Typ eerst de nieuwe vraag.");
      if (await saveChanges() === false) return;
      const { error } = await sb.from("questions").insert({
        text, category: cat, scope: cat === "seizoen" ? "seizoen" : "gp",
        answer_type: form.querySelector(`[data-new-type="${cat}"]`).value,
        points: Number(form.querySelector(`[data-new-pts="${cat}"]`).value) || 0,
        sort_order: maxOrder + 10, active: true,
      });
      if (error) return toast("Toevoegen lukte niet: " + error.message);
      toast("Vraag toegevoegd");
      admQuestions(box);
    }
  };
}

      const { error } = await sb.from("drivers").update({ active: !x.active }).eq("id", x.id);
      if (error) return toast("Opslaan lukte niet: " + error.message);
      refresh(x.active ? "Coureur op niet actief gezet" : "Coureur weer actief");
    } else if (t) {
      const x = teamById(Number(t.dataset.toggleTeam));
      const { error } = await sb.from("teams").update({ active: !x.active }).eq("id", x.id);
      if (error) return toast("Opslaan lukte niet: " + error.message);
      refresh(x.active ? "Team op niet actief gezet" : "Team weer actief");
    }
  };
  $("#newDriver").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const { error } = await sb.from("drivers").insert({ first_name: String(f.get("first")).trim(), last_name: String(f.get("last")).trim() });
    if (error) return toast("Toevoegen lukte niet: " + error.message);
    refresh("Coureur toegevoegd");
  };
  $("#newTeam").onsubmit = async e => {
    e.preventDefault();
    const name = String(new FormData(e.target).get("name")).trim();
    const { error } = await sb.from("teams").insert({ name });
    if (error) return toast(error.code === "23505" ? "Dit team bestaat al." : "Toevoegen lukte niet: " + error.message);
    refresh("Team toegevoegd");
  };
}

init();
</script>
</body>
</html>
